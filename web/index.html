<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b12">
<title>PETROFLOW QUEST - The Quest for the Golden Barrel</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b12; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  #wrap { position: relative; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; box-shadow: 0 0 0 6px #c01010, 0 0 0 10px #ffc000, 0 0 40px #000; touch-action: none; }
  #hint { position: fixed; bottom: 6px; left: 0; right: 0; text-align: center; color: #667; font: 11px monospace; }

  /* ---- touch controls ---- */
  #touch { display: none; }
  body.touch #hint { display: none; }
  body.touch canvas { box-shadow: none; }
  body.touch #touch { display: block; position: fixed; inset: 0; pointer-events: none; font-family: 'PS2P', monospace; }
  body.touch.portrait { align-items: flex-start; }
  #touch > * { pointer-events: auto; touch-action: none; }
  #dpad { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom)); width: 168px; height: 84px; border-radius: 42px; background: #ffffff1f; border: 2px solid #ffffff55; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; padding: 0 22px; }
  #dpad .arrow { font-size: 30px; color: #ffffffaa; pointer-events: none; }
  #dpad.left .l, #dpad.right .r { color: #ffc000; }
  #tbtns { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); width: 190px; height: 110px; pointer-events: none; }
  .tb { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 50%; background: #c0101099; border: 3px solid #ffc000; color: #fff; font-size: 22px; pointer-events: auto; box-sizing: border-box; text-shadow: 2px 2px 0 #000; }
  .tb small { font-size: 7px; margin-top: 4px; color: #ffe9a0; }
  .tb.on { background: #ffc000cc; color: #000; text-shadow: none; }
  .tb.on small { color: #000; }
  #tb-jump { right: 0; bottom: 0; width: 84px; height: 84px; }
  #tb-shoot { right: 100px; bottom: 0; width: 84px; height: 84px; background: #1f6f94aa; }
  #tb-shoot.on { background: #ffc000cc; }
  #tb-up { right: 100px; bottom: 92px; width: 66px; height: 66px; font-size: 16px; background: #1f6f94aa; }
  #tb-up.on { background: #ffc000cc; }
  #tb-up small { margin-top: 2px; font-size: 6px; }
  .tb.sm { width: 42px; height: 42px; font-size: 14px; top: max(8px, env(safe-area-inset-top)); background: #00000088; border-color: #ffffff77; }
  #tb-pause { right: max(10px, env(safe-area-inset-right)); }
  #tb-mute { right: calc(max(10px, env(safe-area-inset-right)) + 52px); }
  body.touch.portrait .tb.sm { top: auto; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 100px); }
  body.touch.portrait #tb-pause { left: 14px; right: auto; }
  body.touch.portrait #tb-mute { left: 64px; right: auto; }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" width="256" height="240"></canvas></div>
<div id="hint">ARROWS / WASD move &middot; Z / SPACE jump &middot; X / J / K shoot (UP to aim up) &middot; P pause &middot; M mute &middot; F fullscreen</div>
<script src="font.js"></script>
<script src="faces.js"></script>
<script src="audio.js"></script>
<script src="art.js"></script>
<script src="levels.js"></script>
<script src="bosses.js"></script>
<script src="game.js"></script>
<script src="touch.js"></script>
<script src="screens.js"></script>
<script>
  addEventListener('keydown', e => { if (e.code === 'KeyF') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } });
</script>
</body>
</html>
